[package]
name = "serlog"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A modern, high-performance logging framework: any number of sinks, each configured on its own, matching the popular loggers through compat profiles."
license = "MIT"
readme = "README.md"
repository = "https://github.com/LeoHeco/ServerLog"
keywords = ["logging", "logger", "loki", "multi-sink", "tracing"]
categories = ["development-tools::debugging"]

[features]
default = ["console", "regex"]
console = []
file = ["dep:flate2"]
loki = ["dep:ureq", "dep:flate2"]
mail = ["dep:lettre"]
config = ["console", "dep:serde", "dep:serde_json", "dep:serde-saphyr", "dep:toml"]
regex = ["dep:regex"]
log = ["dep:log"]
tracing = ["dep:tracing-core", "dep:tracing-subscriber"]
full = ["console", "file", "loki", "mail", "config", "log", "tracing", "regex"]

[dependencies]
flate2 = { version = "1.1", optional = true }
jiff = "0.2"
lettre = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "rustls-platform-verifier"] }
log = { version = "0.4", optional = true }
regex = { version = "1.13", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde-saphyr = { version = "2", optional = true }
serde_json = { version = "1", optional = true, features = ["preserve_order"] }
toml = { version = "1.1", optional = true }
tracing-core = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry"] }
ureq = { version = "3.4", optional = true }

[dev-dependencies]
flate2 = "1.1"
log = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[[test]]
name = "spec"
required-features = ["config"]

[[test]]
name = "slots"
required-features = ["file"]

[[test]]
name = "macros"
required-features = []

[[test]]
name = "processors"
required-features = []

[[test]]
name = "file"
required-features = ["file"]

[[test]]
name = "loki"
required-features = ["loki"]

[[test]]
name = "mail"
required-features = ["mail"]

[[test]]
name = "config"
required-features = ["config", "file"]

[[test]]
name = "bridges"
required-features = ["log", "tracing"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

[package.metadata.docs.rs]
all-features = true
