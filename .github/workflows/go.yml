name: go

on:
  push:
    branches: [main]
    tags: ["go/v*"]
  pull_request:
    paths: ["go/**", "spec/**", ".github/workflows/go.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go/go.sum
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        if: runner.os == 'Linux'
      - run: go test -count=1 ./...
        if: runner.os != 'Linux'

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/go/v')
    runs-on: ubuntu-26.04
    steps:
      - run: curl -fsS "https://proxy.golang.org/github.com/!leo!heco/!server!log/go/@v/${GITHUB_REF_NAME#go/}.info"
        working-directory: .
