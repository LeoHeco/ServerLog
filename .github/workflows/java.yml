name: java

on:
  push:
    branches: [main]
    tags: ["java-v*"]
  pull_request:
    paths: ["java/**", "spec/**", ".github/workflows/java.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: java

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B spotless:check verify
      - name: Phone example
        if: runner.os == 'Linux'
        run: |
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          java -cp "target/classes:$(cat target/cp.txt)" examples/Phone.java | diff examples/Phone.out -

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/java-v')
    runs-on: ubuntu-26.04
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - run: mvn -B -P release -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
