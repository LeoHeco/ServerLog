name: python

on:
  push:
    branches: [main]
    tags: ["py-v*"]
  pull_request:
    paths: ["python/**", "spec/**", ".github/workflows/python.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15"
      - run: uv sync
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@v1
        with:
          packages-dir: python/dist
