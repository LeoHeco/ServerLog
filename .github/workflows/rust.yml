name: rust

on:
  push:
    branches: [main]
    tags: ["rust-v*"]
  pull_request:
    paths: ["rust/**", "spec/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --all-features
      - name: Phone example
        if: runner.os == 'Linux'
        run: cargo run -q --example phone --features config | diff examples/phone.out -

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/rust-v')
    runs-on: ubuntu-26.04
    environment: crates.io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
