name: node

on:
  push:
    branches: [main]
    tags: ["node-v*"]
  pull_request:
    paths: ["node/**", "spec/**", ".github/workflows/node.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: node

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Phone example
        if: runner.os == 'Linux'
        run: node examples/phone.ts | diff examples/phone.out -

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/node-v')
    runs-on: ubuntu-26.04
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm publish --access public
